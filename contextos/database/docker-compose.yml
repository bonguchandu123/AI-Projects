# Local PostgreSQL + pgvector for ContextOS development.
# Host port 5433 (not 5432): a native Windows PostgreSQL service already owns 5432 on this machine.
name: contextos

services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: contextos
      POSTGRES_PASSWORD: contextos_dev_only
      POSTGRES_DB: contextos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted at the parent directory.
      - contextos_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextos -d contextos"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  contextos_pgdata:
